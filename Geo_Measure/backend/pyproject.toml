[project]
name = "geomeasure-backend"
version = "0.1.0"
description = "GeoMeasure: ingest KML / Shapefile datasets and measure their features."
requires-python = ">=3.12"
readme = "../README.md"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "A",             # shadowing builtins
    "S",             # bandit (security)
    "RUF",
    "PTH",           # prefer pathlib
    "C4",
]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/env.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: requires a PostgreSQL database (TEST_DATABASE_URL)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
