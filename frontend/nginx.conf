server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads: MAX_UPLOAD_SIZE_MB (default 50) plus multipart overhead. Bodies
    # between the backend limit and this one get the backend's JSON 413; larger
    # ones are refused here with the same envelope instead of nginx's HTML page.
    client_max_body_size 64m;
    error_page 413 @payload_too_large;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"The uploaded file exceeds the maximum allowed size.","details":{}}}';
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Processing is synchronous; large datasets need time.
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
